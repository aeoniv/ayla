# OpenClaw control-agent configuration.
#
# This agent is an OPERATIONS watchdog only. It observes the delivery-service
# from the outside (health polling + read-only bucket audits) and can raise
# alerts. It is deliberately fenced off from anything that could let it act as,
# or escalate into, the delivery-service itself.
#
# Run this host behind Tailscale; the gateway must never bind 0.0.0.0
# (see README.md).

agent:
  name: ayla-control-agent
  description: >
    Watchdog for the Telegram VoD delivery-service. Polls health, audits the
    video bucket for missing thumbnails, and alerts the owner on Telegram.

gateway:
  # Bind to the Tailscale interface / loopback ONLY. Never 0.0.0.0.
  # OpenClaw refuses to start if bind_address resolves to a public 0.0.0.0.
  bind_address: "100.64.0.1"   # replace with this host's Tailscale IP
  port: 8765
  require_tailscale: true

working_directory: /opt/ayla/control-agent

# --------------------------------------------------------------------------
# DENY-LIST — the security boundary. These are hard denials, not advisories.
# --------------------------------------------------------------------------
permissions:
  shell:
    # Shell is confined to the working directory. Anything resolving outside it
    # (absolute paths, .., symlinks) is denied.
    allow_cwd_only: true
    jail_root: /opt/ayla/control-agent
    deny_paths:
      - "/"
      - "/home"
      - "/root"
      - "/etc"
      - "/var"
      - "~/.config/gcloud"          # no delivery-service SA credentials
      - "**/service-account*.json"
      - "**/*-sa-key*.json"
      - "**/credentials*.json"
    deny_commands:
      - "gcloud iam service-accounts keys *"   # cannot mint SA keys
      - "gcloud auth print-access-token *"      # cannot exfil tokens
      - "gcloud run deploy *"                   # cannot deploy / mutate service
      - "gcloud run services update *"
      - "curl * delivery-service*"

  cloud:
    # The control-agent uses its OWN minimal identity, never the delivery
    # service account. It may DESCRIBE the service and READ the bucket; it may
    # not assume, impersonate, or read the credentials of delivery-service-sa.
    deny_service_accounts:
      - "delivery-service-sa@*"
    deny_impersonation: true
    allow_readonly_describe: true

  network:
    # Egress allow-list: Telegram (alerts) + Google APIs (describe/list).
    allow_egress:
      - "api.telegram.org"
      - "run.googleapis.com"
      - "storage.googleapis.com"
    deny_egress_default: true

secrets:
  # Only the alerting bot token + chat id are provided to this agent. The
  # delivery-service bot token and SA key are intentionally NOT referenced here.
  telegram_alert_bot_token_env: CONTROL_AGENT_ALERT_BOT_TOKEN
  telegram_alert_chat_id_env: CONTROL_AGENT_ALERT_CHAT_ID

heartbeat:
  spec: HEARTBEAT.md
  interval_minutes: 5

skills:
  directory: skills
  enabled:
    - gcs-thumbnail-audit
